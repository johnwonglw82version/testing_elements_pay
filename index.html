<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QFPay Elements - GitHub Pages Tester</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- QFPay Elements SDK -->
    <script src="https://test-cdn-hk.qfapi.com/qfpay_element/qfpay.js"></script>

    <style>
        .log-console { font-family: 'Menlo', monospace; font-size: 11px; }
        .loader { border-top-color: #3498db; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">QFPay Elements <span class="text-blue-600">Live Host</span></h1>
                <p class="text-sm text-gray-500">Testing Environment for GitHub Pages</p>
            </div>
            <div class="flex gap-2">
                <span id="proxy-badge" class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-bold border border-green-200">Proxy: Corsfix Active</span>
                <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-bold border border-blue-200">SSL Secure</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Left: Config -->
            <div class="lg:col-span-4 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                    <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Credentials</h2>
                    <div class="space-y-4">
                        <input type="text" id="appCode" placeholder="App Code" class="w-full p-3 bg-gray-50 border rounded-xl text-sm outline-none focus:border-blue-500">
                        <input type="password" id="appKey" placeholder="Secret Key" class="w-full p-3 bg-gray-50 border rounded-xl text-sm outline-none focus:border-blue-500">
                    </div>

                    <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mt-6 mb-4">Order Details</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="number" id="txamt" value="1000" class="p-3 bg-gray-50 border rounded-xl text-sm">
                        <input type="text" id="txcurrcd" value="HKD" class="p-3 bg-gray-50 border rounded-xl text-sm">
                    </div>
                    
                    <button onclick="fetchIntent()" class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95">
                        Create Payment Intent
                    </button>
                    <button onclick="renderMock()" class="w-full mt-2 text-gray-500 text-xs hover:underline py-2">
                        Just test UI (Debug Mode)
                    </button>
                </div>
            </div>

            <!-- Right: Preview -->
            <div class="lg:col-span-8 space-y-6">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="p-4 bg-gray-50 border-b flex justify-between items-center">
                        <span class="text-sm font-bold text-gray-600">Payment Element</span>
                        <div id="loader-icon" class="hidden w-5 h-5 border-2 border-gray-200 border-t-blue-600 rounded-full animate-spin"></div>
                    </div>
                    
                    <div id="payment-stage" class="p-8 min-h-[350px] flex flex-col items-center justify-center">
                        <div id="qfpay-container" class="w-full max-w-md"></div>
                        <div id="empty-state" class="text-center">
                            <div class="text-gray-300 mb-2">
                                <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M3 10h18M7 15h1m4 0h1m4 0h1m-7 4h12a2 2 0 002-2V5a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            </div>
                            <p class="text-gray-400 text-sm">Waiting for Payment Intent...</p>
                        </div>
                    </div>
                </div>

                <!-- Console -->
                <div class="bg-gray-900 rounded-2xl shadow-xl overflow-hidden border border-gray-800">
                    <div class="px-4 py-2 bg-gray-800 text-[10px] text-gray-400 font-mono uppercase">System Log</div>
                    <div id="console" class="log-console p-4 h-48 overflow-y-auto text-green-400"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function log(msg, isError = false) {
            const con = document.getElementById('console');
            const time = new Date().toLocaleTimeString();
            con.innerHTML += `<div><span class="text-gray-600">[${time}]</span> <span class="${isError ? 'text-red-400' : ''}">${msg}</span></div>`;
            con.scrollTop = con.scrollHeight;
        }

        function generateSignature(params, secret) {
            const sorted = Object.keys(params).sort();
            const str = sorted.map(k => `${k}=${params[k]}`).join('&') + '&' + secret;
            return CryptoJS.MD5(str).toString().toUpperCase();
        }

        async function fetchIntent() {
            const code = document.getElementById('appCode').value.trim();
            const key = document.getElementById('appKey').value.trim();
            
            if (!code || !key) {
                log("Error: Please enter App Code and Secret Key.", true);
                return;
            }

            log("🔄 Creating Payment Intent...");
            document.getElementById('loader-icon').classList.remove('hidden');
            document.getElementById('empty-state').classList.add('hidden');

            const payload = {
                txamt: document.getElementById('txamt').value,
                txcurrcd: document.getElementById('txcurrcd').value,
                out_trade_no: "GH_PAGES_" + Date.now()
            };

            const sign = generateSignature(payload, key);
            
            // Using Corsfix - a robust proxy that allows custom headers and POST
            const targetUrl = "https://openapi-test.qfapi.com/payment_element/v1/create_payment_intent";
            const proxyUrl = `https://proxy.corsfix.com/?${targetUrl}`;

            try {
                const response = await fetch(proxyUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-QF-APPCODE': code,
                        'X-QF-SIGN': sign
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("Proxy Error: " + response.statusText);

                const data = await response.json();
                if (data.payment_intent) {
                    log("✅ Success! Intent: " + data.payment_intent);
                    initSDK(data.payment_intent);
                } else {
                    log("❌ QFPay Error: " + (data.respmsg || "Unknown error"), true);
                }
            } catch (err) {
                log("❌ Network Error: " + err.message, true);
                log("💡 GitHub Pages blocked the request. Try clicking 'Debug Mode' to test visuals.", false);
            } finally {
                document.getElementById('loader-icon').classList.add('hidden');
            }
        }

        function renderMock() {
            log("🛠 Debug Mode: Mocking intent for UI test...");
            document.getElementById('empty-state').classList.add('hidden');
            initSDK("MOCK_INTENT_" + Date.now());
        }

        function initSDK(intent) {
            try {
                const qfpay = QFpay.config({ region: 'hk', env: 'test' });
                const elements = qfpay.element({ theme: 'light' });
                
                document.getElementById('qfpay-container').innerHTML = '';
                elements.create('#qfpay-container');
                
                log("✨ SDK Elements mounted successfully.");
            } catch (e) {
                log("❌ SDK Error: " + e.message, true);
            }
        }

        log("System Ready. Enter credentials to begin.");
    </script>
</body>
</html>
