<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QFPay Elements SDK Integration</title>
    
    <!-- Load the QFPay Elements SDK -->
    <script src="https://sdk.qfapi.com/js/v1/elements.js"></script>
    
    <style>
        :root {
            --primary-color: #0066cc;
            --bg-color: #f4f7f6;
            --panel-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            max-width: 1000px;
            width: 100%;
        }

        .panel {
            background: var(--panel-bg);
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            flex: 1;
            min-width: 300px;
        }

        h2 {
            margin-top: 0;
            font-size: 1.4rem;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #555;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #fafafa;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .checkbox-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            cursor: pointer;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            width: 100%;
            margin-top: 15px;
            transition: background-color 0.2s;
        }

        button:hover { background-color: #0052a3; }
        button:disabled { background-color: #a0c4e8; cursor: not-allowed; }

        #payment-element-container {
            min-height: 250px;
            border: 2px dashed var(--border-color);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #888;
            background: #fafafa;
            transition: all 0.3s ease;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
            word-break: break-word;
        }

        .status.success { background: #e6f4ea; color: #1e8e3e; display: block; border: 1px solid #cce8d6; }
        .status.error { background: #fce8e6; color: #d93025; display: block; border: 1px solid #fad2cf; }
    </style>
</head>
<body>

<div class="container">
    <!-- Configuration Panel -->
    <div class="panel">
        <h2>1. SDK Configuration</h2>
        
        <div class="form-group">
            <label for="qf-code">Merchant Code</label>
            <input type="text" id="qf-code" placeholder="e.g., QF_TEST_12345">
        </div>
        
        <div class="form-group">
            <label for="qf-key">Merchant Key</label>
            <input type="text" id="qf-key" placeholder="e.g., sk_test_abcdef123456">
        </div>

        <div class="form-group">
            <label for="theme-select">Appearance Theme</label>
            <select id="theme-select">
                <option value="light">Light (Default)</option>
                <option value="dark">Dark</option>
                <option value="flat">Flat</option>
            </select>
        </div>

        <div class="form-group">
            <label>Enable Payment Methods</label>
            <div class="checkbox-group">
                <label><input type="checkbox" class="pm-checkbox" value="card" checked> Credit Card</label>
                <label><input type="checkbox" class="pm-checkbox" value="alipay" checked> Alipay</label>
                <label><input type="checkbox" class="pm-checkbox" value="wechatpay" checked> WeChat Pay</label>
                <label><input type="checkbox" class="pm-checkbox" value="payme"> PayMe</label>
            </div>
        </div>

        <button id="btn-init" onclick="initializeElementsSDK()">Mount Payment Element</button>
    </div>

    <!-- Checkout Panel -->
    <div class="panel">
        <h2>2. Checkout UI</h2>
        <form id="payment-form">
            
            <!-- QFPay Elements will be injected into this empty div -->
            <div id="payment-element-container">
                <span id="placeholder-text">Waiting for configuration...</span>
            </div>
            
            <button type="submit" id="submit-button" disabled>Confirm Payment</button>
            <div id="payment-message" class="status"></div>
        </form>
    </div>
</div>

<script>
    let qfpay = null;
    let paymentElement = null;

    /**
     * Reads the configuration inputs, initializes the QFPay instance in testing mode,
     * configures the appearance, and mounts the Element to the DOM.
     */
    async function initializeElementsSDK() {
        const code = document.getElementById('qf-code').value.trim();
        const key = document.getElementById('qf-key').value.trim();
        const theme = document.getElementById('theme-select').value;
        
        // Extract dynamically selected payment methods
        const selectedMethods = Array.from(document.querySelectorAll('.pm-checkbox:checked'))
                                     .map(cb => cb.value);

        if (!code || !key) {
            showMessage('Missing Credentials: You must provide both the Merchant Code and Key.', 'error');
            return;
        }

        if (selectedMethods.length === 0) {
            showMessage('Configuration Error: Select at least one payment method.', 'error');
            return;
        }

        try {
            // 1. Instantiate QFPay pointing to the living testing environment
            qfpay = new QFPay(code, {
                key: key,
                environment: 'sandbox', // Directs API calls to the testing environment
                locale: 'en'
            });

            // 2. Define standard UI appearance mapping based on selection
            const appearance = {
                theme: theme,
                variables: {
                    colorPrimary: '#0066cc',
                    colorBackground: theme === 'dark' ? '#2c2c2c' : '#ffffff',
                    colorText: theme === 'dark' ? '#f4f4f4' : '#333333',
                    borderRadius: '6px'
                }
            };

            // 3. Initialize the Elements group with your preferences
            const elements = qfpay.elements({
                appearance: appearance,
                paymentMethods: selectedMethods
            });

            // 4. Create the main unified payment element
            const container = document.getElementById('payment-element-container');
            container.innerHTML = ''; // Clear previous instances or placeholder text
            container.style.border = 'none';
            container.style.padding = '0';

            paymentElement = elements.create('payment', {
                layout: 'tabs' // Displays payment methods as selectable tabs
            });

            // 5. Mount to the DOM
            paymentElement.mount('#payment-element-container');

            // 6. Listen for the 'ready' event to unlock checkout capabilities
            paymentElement.on('ready', () => {
                document.getElementById('submit-button').disabled = false;
                showMessage('Connection to Living Testing Environment established. Element ready.', 'success');
            });

        } catch (error) {
            console.error('QFPay Integration Error:', error);
            showMessage('Failed to initialize the SDK. Verify your Code/Key in the browser console.', 'error');
        }
    }

    /**
     * Intercepts the form submission to process the payment payload securely.
     */
    document.getElementById('payment-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        
        if (!qfpay || !paymentElement) return;

        const submitBtn = document.getElementById('submit-button');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Processing Transaction...';
        showMessage('Communicating with test gateway...', 'success');

        try {
            // Confirm payment details within the living test environment
            const { error, paymentIntent } = await qfpay.confirmPayment({
                elements: paymentElement,
                confirmParams: {
                    // Necessary for redirect-based methods like Alipay/WeChat Pay
                    return_url: window.location.href, 
                }
            });

            if (error) {
                // Display validation or structural errors returned by the SDK
                showMessage(`Transaction Failed: ${error.message}`, 'error');
            } else {
                // Success branch
                showMessage(`Test Payment Successful! Status: ${paymentIntent.status}`, 'success');
            }
        } catch (err) {
            console.error(err);
            showMessage('An unexpected error occurred during confirmation.', 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Confirm Payment';
        }
    });

    /**
     * UI helper for managing system feedback
     */
    function showMessage(message, type) {
        const msgContainer = document.getElementById('payment-message');
        msgContainer.textContent = message;
        msgContainer.className = `status ${type}`;
    }
</script>

</body>
</html>
